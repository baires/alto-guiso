<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alto Guiso Index</title>
    <meta name="description" content="Alto Guiso Index aka AGI">
    <meta property="og:title" content="Alto Guiso Index">
    <meta property="og:description" content="Alto Guiso Index aka AGI">
    <meta property="og:image" content="agi.png">
    <meta property="og:url" content="https://alto-guiso-alpha.vercel.app/">
    <meta name="twitter:card" content="summary_large_image">
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f7f2;
        --ink: #181713;
        --muted: #5f5b51;
        --accent: #c4211f;
        --gold: #f0b429;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        overflow-x: hidden;
      }

      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .index {
        text-align: center;
        transition:
          opacity 260ms ease,
          transform 260ms ease;
      }

      body.guiso-mode .index {
        opacity: 0;
        transform: translateY(-18px) scale(0.98);
        pointer-events: none;
      }

      .headline {
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 1;
        margin-bottom: 1rem;
        font-weight: 750;
      }

      .detail {
        margin-top: 18px;
        color: var(--muted);
        font-size: clamp(0.95rem, 2vw, 1.2rem);
      }

      .error {
        max-width: 36rem;
        color: var(--muted);
        font-size: clamp(1.25rem, 3vw, 1.75rem);
        line-height: 1.35;
        text-align: center;
      }

      .guiso-trigger {
        position: fixed;
        right: clamp(18px, 3vw, 36px);
        bottom: clamp(18px, 3vw, 36px);
        min-width: 46px;
        height: 34px;
        border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--paper) 84%, transparent);
        color: color-mix(in srgb, var(--ink) 72%, transparent);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        line-height: 1;
        letter-spacing: 0;
        box-shadow: 0 8px 22px rgb(24 23 19 / 0.08);
        transition:
          background 180ms ease,
          color 180ms ease,
          border-color 180ms ease,
          transform 180ms ease;
        z-index: 10;
      }

      .guiso-trigger:hover,
      .guiso-trigger:focus-visible {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
        transform: translateY(-2px);
        outline: none;
      }

      .guiso-trigger::after {
        content: "alto guiso";
        position: absolute;
        right: 0;
        bottom: calc(100% + 8px);
        width: max-content;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-size: 12px;
        font-weight: 650;
        padding: 6px 9px;
        opacity: 0;
        transform: translateY(4px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
        pointer-events: none;
      }

      .guiso-trigger:hover::after,
      .guiso-trigger:focus-visible::after {
        opacity: 1;
        transform: translateY(0);
      }

      body.guiso-mode .guiso-trigger {
        opacity: 0;
        pointer-events: none;
      }

      .guiso-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(24px, 4vw, 56px);
        background:
          radial-gradient(circle at 20% 10%, #f0b429 0 12%, transparent 25%),
          radial-gradient(circle at 80% 18%, #c4211f 0 10%, transparent 24%),
          linear-gradient(135deg, #17130e, #4b1c13 54%, #100f0c);
        opacity: 0;
        overflow-y: auto;
        pointer-events: none;
        transform: scale(1.04);
        transition:
          opacity 280ms ease,
          transform 420ms cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 4;
      }

      body.guiso-mode .guiso-stage {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }

      .guiso-stage::before,
      .guiso-stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .guiso-stage::before {
        background: repeating-linear-gradient(
          0deg,
          rgb(255 255 255 / 0.08) 0,
          rgb(255 255 255 / 0.08) 1px,
          transparent 1px,
          transparent 6px
        );
        mix-blend-mode: overlay;
        animation: scan 900ms linear infinite;
      }

      .guiso-stage::after {
        border: clamp(8px, 2vw, 22px) solid var(--gold);
        box-shadow: inset 0 0 80px rgb(0 0 0 / 0.45);
      }

      .guiso-shell {
        position: relative;
        width: min(100%, 1040px);
        min-height: 0;
        display: grid;
        justify-items: center;
        gap: clamp(18px, 2.8svh, 30px);
        z-index: 1;
      }

      .guiso-message {
        width: min(100%, 780px);
        margin: 0;
        color: #fff7df;
        font-size: clamp(2.4rem, 8svh, 6rem);
        font-weight: 900;
        line-height: 0.86;
        text-transform: uppercase;
        text-wrap: balance;
        text-shadow:
          4px 4px 0 var(--accent),
          8px 8px 0 rgb(0 0 0 / 0.55);
        animation: pulse 680ms ease-in-out infinite alternate;
      }

      .video-wrap {
        position: relative;
        width: min(100%, 900px, calc(54svh * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #000;
        transform: rotate(-0.7deg);
        box-shadow:
          0 28px 80px rgb(0 0 0 / 0.48),
          0 0 0 8px #fff7df,
          0 0 0 14px var(--accent);
        overflow: hidden;
      }

      .video-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      .video-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgb(196 33 31 / 0.2), transparent 18% 82%, rgb(240 180 41 / 0.22)),
          repeating-linear-gradient(90deg, transparent 0 18px, rgb(255 255 255 / 0.08) 18px 20px);
        mix-blend-mode: screen;
        pointer-events: none;
        animation: flicker 160ms steps(2, end) infinite;
      }

      .close-guiso {
        position: fixed;
        right: clamp(26px, 4vw, 62px);
        top: clamp(22px, 4vw, 46px);
        z-index: 2;
        border: 1px solid rgb(255 247 223 / 0.5);
        border-radius: 999px;
        background: rgb(0 0 0 / 0.38);
        color: #fff7df;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 9px 16px;
        transition:
          background 180ms ease,
          transform 180ms ease;
      }

      .close-guiso:hover,
      .close-guiso:focus-visible {
        background: rgb(0 0 0 / 0.68);
        outline: none;
        transform: translateY(-1px);
      }

      @keyframes pulse {
        from {
          transform: translateX(-1px) rotate(-0.4deg);
        }

        to {
          transform: translateX(2px) rotate(0.3deg) scale(1.015);
        }
      }

      @keyframes flicker {
        50% {
          opacity: 0.68;
          transform: translateX(2px);
        }
      }

      @keyframes scan {
        to {
          transform: translateY(6px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-height: 720px) {
        .guiso-stage {
          align-items: flex-start;
        }

        .guiso-message {
          font-size: clamp(2rem, 7svh, 4.2rem);
          width: min(100%, 620px);
        }

        .video-wrap {
          width: min(100%, 760px, calc(48svh * 16 / 9));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="index" aria-label="Alto Guiso Index">
        <p class="headline">
          Con <strong id="price">...</strong> pesos <br> me hago Alto Guiso
        </p>
        <p class="detail" id="detail">Actualizando dolar blue</p>
      </section>
    </main>
    <button class="guiso-trigger" type="button" aria-label="Activar modo alto guiso">
      15
    </button>
    <aside class="guiso-stage" aria-hidden="true">
      <div class="guiso-shell">
        <button class="close-guiso" type="button">Cerrar</button>
        <p class="guiso-message">con 15 pesos me hago alto guiso</p>
        <div class="video-wrap" id="video"></div>
      </div>
    </aside>
    <script>
      const BLUE_URL = "https://api.bluelytics.com.ar/v2/latest";
      const VIDEO_URL =
        "https://www.youtube.com/embed/Saa86WoG1ng?autoplay=1&rel=0&modestbranding=1";
      const RATIO = 3.4;

      const price = document.querySelector("#price");
      const detail = document.querySelector("#detail");
      const trigger = document.querySelector(".guiso-trigger");
      const close = document.querySelector(".close-guiso");
      const stage = document.querySelector(".guiso-stage");
      const video = document.querySelector("#video");

      function openGuisoMode() {
        document.body.classList.add("guiso-mode");
        stage.setAttribute("aria-hidden", "false");
        video.innerHTML = `<iframe src="${VIDEO_URL}" title="Con 15 pesos me hago alto guiso" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      }

      function closeGuisoMode() {
        document.body.classList.remove("guiso-mode");
        stage.setAttribute("aria-hidden", "true");
        video.innerHTML = "";
      }

      trigger.addEventListener("click", openGuisoMode);
      close.addEventListener("click", closeGuisoMode);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeGuisoMode();
        }
      });

      fetch(BLUE_URL)
        .then((response) => {
          if (!response.ok) {
            throw new Error("Bluelytics request failed");
          }

          return response.json();
        })
        .then((data) => {
          const sell = Number(data?.blue?.value_sell);

          if (!sell) {
            throw new Error("Bluelytics response missing sell rate");
          }

          price.textContent = `$${Math.round(RATIO * sell).toFixed(0)}`;
          detail.textContent = `${RATIO} * $${sell} dolar blue`;
        })
        .catch(() => {
          document.querySelector("main").innerHTML =
            '<p class="error">No se pudo actualizar el indice ahora. Proba de nuevo en un rato.</p>';
        });
    </script>
  </body>
</html>
